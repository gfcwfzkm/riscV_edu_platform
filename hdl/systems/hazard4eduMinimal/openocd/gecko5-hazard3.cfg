# OpenOCD configuration for the hazard4eduMinimal SoC on the GECKO5Education.
#
# The Hazard3 JTAG-DTM is not a separate TAP: its DTMCS and DMI registers sit
# behind the ECP5's own chip TAP (JTAGG primitive, private instructions ER1 =
# 0x32 and ER2 = 0x38), so the same FT2232H channel that programs the FPGA is
# used for debugging. Based on Hazard3's example_soc/ulx3s-openocd.cfg.
#
# Usage: openocd -f gecko5-hazard3.cfg            (gdb on :3333, telnet on :4444)

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
# The board's FT2232H reports this generic product string; it tells it apart from
# other FT2232 based probes (e.g. "Dual RS232" on the FT2232D). Override with
#   -c 'ftdi device_desc "..."'  or select by USB location with 'adapter usb location'.
ftdi device_desc "Dual RS232-HS"
ftdi channel 0
# ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS (MPSSE JTAG)
ftdi layout_init 0x0008 0x000b
transport select jtag
adapter speed 6000

# ECP5 LFE5U-85 chip TAP
set _CHIPNAME lfe5u85
jtag newtap $_CHIPNAME hazard3 -expected-id 0x41113043 -irlen 8 -irmask 0xFF -ircapture 0x5

set _TARGETNAME $_CHIPNAME.hazard3
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

gdb_report_data_abort enable
